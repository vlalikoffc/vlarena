[package]
name = "vlarena"
version = "0.1.0"
description = "vlarena — a desktop LLM battle arena"
authors = ["vlalikoffc"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "vlarena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# `unsafe-headers` lets us send provider-specific headers (e.g. OpenRouter's
# HTTP-Referer, Anthropic's direct-browser flag) through the Rust HTTP client.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
debug = false
incremental = false
